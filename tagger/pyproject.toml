[project]
name = "tagger"
version = "0.1.0"
description = "Automatic image tagging service backed by Google Cloud Vision"
readme = "README.md"
authors = [
    { name = "Alessandro Santoemma", email = "alessandro.santoemma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth>=2.0",
    "google-cloud-vision>=3.16.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tagger = "tagger.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
